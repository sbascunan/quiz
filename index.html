<style>

[data-theme="dark"]{--bg:#1a120c;--fg:#f6ebe0;--card:#261a12;--mut:#b79f8b;--ac:#ff922b;--on:#1a120c;--bd:#4a3322;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a120c;--fg:#f6ebe0;--card:#261a12;--mut:#b79f8b;--ac:#ff922b;--on:#1a120c;--bd:#4a3322;color-scheme:dark}}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.6rem;margin:.3em 0}h2{font-size:1.25rem;margin:.6em 0}h3{margin:.2em 0}
.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.card.good{border:2px solid #2f9e44}.card.bad{border:2px solid #e03131}.card.warn{border:2px solid var(--ac)}
button,input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;-webkit-appearance:none;appearance:none;touch-action:manipulation}
select{padding-right:12px;max-width:100%}

button{cursor:pointer}button:disabled{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:4px;border-bottom:1px solid var(--bd);flex-wrap:nowrap}

h1+.mut{margin:0 0 .6em}

.card{border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(60,30,10,.06),0 8px 22px rgba(60,30,10,.05)}
button,input,select{min-height:44px;border-radius:12px}

 .card>.btn,#app>.btn{width:100%}

 .pc .nm{font-size:.85rem}

<script>
const GOOGLE_CLIENT_ID="994362878650-s19b3fu9rvjo6ia666ld2fj0cbjle9nh.apps.googleusercontent.com";

const $=s=>document.querySelector(s),A=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const SYM=["▲","◆","●","■"],KEYS=["1","2","3","4"],AR=id=>AREAS.filter(a=>a.id===id)[0];

// ===== DECODIFICACIÓN UTF-8 Y REPARACIÓN DE NOMBRES =====
function fixUtf8(s){
  if(!s||typeof s!=="string"||!/Ã/.test(s))return s;
  try{return new TextDecoder("utf-8",{fatal:true}).decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}catch(e){return s}
}
function decodeJWT(token){
  const b64=token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder("utf-8").decode(bytes));
}

// ===== TEMA CLARO / OSCURO (AUTOMÁTICO CON EL SISTEMA AL INICIO) =====
const sysDark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function isDarkActive(){
  const attr=document.documentElement.getAttribute("data-theme");
  if(attr==="dark")return true;
  if(attr==="light")return false;
  return !!(sysDark&&sysDark.matches);
}
const SVG=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICO_SUN=SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),ICO_MOON=SVG('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
function updateThemeIcon(){
  const b=$("#thmBtn");if(!b)return;
  const dark=isDarkActive();
  b.innerHTML=dark?ICO_MOON:ICO_SUN;
  b.title=dark?"Modo oscuro activo (pulsar para modo claro)":"Modo claro activo (pulsar para modo oscuro)";
}
function applyTheme(t){
  if(t==="light"||t==="dark"){
    document.documentElement.setAttribute("data-theme",t);
    try{localStorage.setItem("dp_theme",t)}catch(e){}
  }else{
    document.documentElement.removeAttribute("data-theme");
    try{localStorage.removeItem("dp_theme")}catch(e){}
  }
  updateThemeIcon();
}
function toggleTheme(){applyTheme(isDarkActive()?"light":"dark")}
applyTheme((()=>{try{const v=localStorage.getItem("dp_theme");return(v==="light"||v==="dark")?v:"auto"}catch(e){return "auto"}})());
if(sysDark&&sysDark.addEventListener)sysDark.addEventListener("change",()=>updateThemeIcon());

// ===== AUTENTICACIÓN =====
let USER=null;
try{
  USER=JSON.parse(localStorage.getItem("dp_session"));
  if(USER&&USER.n){USER.n=fixUtf8(USER.n);localStorage.setItem("dp_session",JSON.stringify(USER))}
}catch(e){}
function saveSession(u){USER=u;try{if(u)localStorage.setItem("dp_session",JSON.stringify(u));else localStorage.removeItem("dp_session")}catch(e){}renderBadge()}
function renderBadge(){const b=$("#ubadge");if(!b)return;b.innerHTML=USER?`<span class="badge">${esc(USER.n)} <span class="mut">· ${USER.t}</span></span> <button data-act="logout" style="padding:5px 8px;font-size:.85rem">Cerrar sesión</button>`:""}

async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function validPwd(p){return p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/[0-9]/.test(p)}
async function authReg(){
  const u=($("#au").value||"").trim().slice(0,32),p=$("#ap").value||"",m=$("#amsg");
  if(u.length<3)return m.textContent="El usuario debe tener al menos 3 caracteres.";
  if(!validPwd(p))return m.textContent="La contraseña requiere mínimo 8 caracteres, mayúscula, minúscula y número.";
  let db={};try{db=JSON.parse(localStorage.getItem("dp_users")||"{}")}catch(e){}
  const k=u.toLowerCase();if(db[k])return m.textContent="Ese nombre de usuario ya está registrado.";
  const salt=Math.random().toString(36).slice(2,10),h=await sha256(salt+":"+p);
  db[k]={n:u,s:salt,h:h};try{localStorage.setItem("dp_users",JSON.stringify(db))}catch(e){}
  saveSession({n:u,t:"Cuenta"});home();
}
async function authLogin(){
  const u=($("#au").value||"").trim(),p=$("#ap").value||"",m=$("#amsg");
  let db={};try{db=JSON.parse(localStorage.getItem("dp_users")||"{}")}catch(e){}
  const r=db[u.toLowerCase()];if(!r)return m.textContent="Usuario no encontrado.";
  const h=await sha256(r.s+":"+p);if(h!==r.h)return m.textContent="Contraseña incorrecta.";
  saveSession({n:fixUtf8(r.n),t:"Cuenta"});home();
}
function initGoogle(){
  const gBox=$("#gbtn");if(!gBox||!GOOGLE_CLIENT_ID)return;
  if(window.google&&google.accounts&&google.accounts.id){
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      callback:res=>{
        try{
          const payload=decodeJWT(res.credential);
          const fullName=(payload.name||payload.given_name||payload.email||"Usuario").trim().slice(0,32);
          saveSession({n:fullName,t:"Google"});home();
        }catch(e){}
      }
    });
    google.accounts.id.renderButton(gBox,{theme:"outline",size:"large"});
  }else{
    setTimeout(initGoogle,400);
  }
}

// ===== GESTIÓN DE RÉCORDS Y RANKING GLOBAL =====
function recKey(){return "ag2-"+selA+selL+"-"+selN+"-"+selR}
function getRec(k){
  try{
    const raw=localStorage.getItem(k);if(!raw)return{p:0,n:""};
    if(raw[0]==="{"){const o=JSON.parse(raw);o.n=fixUtf8(o.n||"Anónimo");return o}
    return{p:+raw||0,n:"Anónimo"};
  }catch(e){return{p:0,n:""}}
}
function setRec(k,p,n){try{localStorage.setItem(k,JSON.stringify({p:p,n:fixUtf8(n||"Anónimo")}))}catch(e){}}

function exportRecords(){
  const data={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf("ag2-")===0)data[k]=getRec(k);
    }
  }catch(e){}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="records_duelo_preguntas.json";
  a.click();
}
function importRecords(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const obj=JSON.parse(ev.target.result);
        Object.keys(obj).forEach(k=>{
          if(k.indexOf("ag2-")===0&&obj[k]&&obj[k].p){
            const cur=getRec(k);
            if(obj[k].p>cur.p)setRec(k,+obj[k].p,obj[k].n);
          }
        });
        home();
      }catch(err){}
    };
    reader.readAsText(file);
  };
  inp.click();
}

function allCategoryRankingHTML(){
  const list=AREAS.map(a=>({id:a.id,n:a.n,L:a.L})).concat([{id:"*",n:"Mezcla de todas las áreas",L:[]}]);
  const bestByCat={};
  list.forEach(c=>{bestByCat[c.id]={cat:c.n,p:0,n:"—",cfg:"Sin marca"}});
  try{
    for(let idx=0;idx<localStorage.length;idx++){
      const k=localStorage.key(idx);
      if(!k||k.indexOf("ag2-")!==0)continue;
      const r=getRec(k);if(!r||!r.p)continue;
      const body=k.slice(4),parts=body.split("-");
      if(parts.length<3)continue;
      const nQ=parts[parts.length-2],nR=parts[parts.length-1],al=parts.slice(0,parts.length-2).join("-");
      let catId="",lvStr="";
      if(al.indexOf("*")===0){catId="*";lvStr="Progresivo"}
      else{
        for(let j=0;j<AREAS.length;j++){
          const aid=AREAS[j].id;
          if(al.indexOf(aid)===0){
            catId=aid;
            const lv=+al.slice(aid.length);
            lvStr=lv<0?"Progresivo":(AREAS[j].L[lv]||("Nivel "+(lv+1)));
            break;
          }
        }
      }
      if(catId&&bestByCat[catId]&&r.p>bestByCat[catId].p){
        bestByCat[catId]={cat:bestByCat[catId].cat,p:r.p,n:fixUtf8(r.n||"Anónimo"),cfg:`${lvStr} (${nR}×${nQ})`};
      }
    }
  }catch(e){}
  const rowsHTML=list.map(c=>{
    const b=bestByCat[c.id];
    return `<tr><td><b>${esc(b.cat)}</b></td><td>${esc(b.cfg)}</td><td>${esc(b.n)}</td><td><b>${b.p||"—"}</b></td></tr>`;
  }).join("");
  return `<div class="card"><div class="top"><h3>Ranking por categorías</h3><div class="row" style="margin-top:0"><button data-act="exprec" style="padding:4px 8px;font-size:.82rem">Exportar</button><button data-act="imprec" style="padding:4px 8px;font-size:.82rem">Importar</button></div></div>
  <div style="overflow-x:auto"><table class="rk"><thead><tr><th>Categoría</th><th>Modalidad</th><th>Jugador</th><th>Puntos</th></tr></thead><tbody>${rowsHTML}</tbody></table></div></div>`;
}

// ===== MOTOR DE PREGUNTAS =====
const QQ=e=>{const x=BANK[e[0]][e[1]][e[2]],r=rng(e[3]);if(typeof x==="function")return x(r);const o=shr(r,x.o.map((t,k)=>[t,k]));return{q:x.q,e:x.e,o:o.map(a=>a[0]),c:o.map(a=>a[1]).indexOf(x.c)}};
const TT=e=>AR(e[0]).T[e[1]]||30,LB=e=>AR(e[0]).n+" · "+AR(e[0]).L[e[1]];
let MODE="off",selA="ga",selL=-1,selN=5,selR=3,tick=null,t0=0,curT=20,lastRecKey="",myStats={ok:0,tot:0,maxSt:0,wrong:[]};
const pts=ms=>Math.round(1000*(1-.5*Math.min(ms,curT*1000)/(curT*1000)));
const msg=t=>{const m=$("#msg");if(m)m.textContent=t};
const lvOpts=()=>selA==="*"?`<option value="-1">Progresivo (fácil → difícil, en cada área)</option>`:`<option value="-1"${selL<0?" selected":""}>Progresivo (fácil → difícil)</option>`+AR(selA).L.map((l,i)=>`<option value="${i}"${selL===i?" selected":""}>${i+1}. ${l} (${AR(selA).T[i]} s)</option>`).join("");
const cfg=()=>`<select id="ar">${AREAS.map(a=>`<option value="${a.id}"${a.id===selA?" selected":""}>${a.n}</option>`).join("")}<option value="*"${selA==="*"?" selected":""}>Mezcla de todas las áreas</option></select> <select id="lv">${lvOpts()}</select><div class="row"><label>Preguntas por ronda <input id="n" type="number" value="${selN}" min="3" max="20" style="width:4.5em"></label><select id="rr"><option value="3"${selR===3?" selected":""}>Partida completa (3 rondas)</option><option value="1"${selR===1?" selected":""}>Una sola ronda</option></select></div>`;

function mkRounds(a,l,n,R){
  const avail=AREAS.filter(x=>(BANK[x.id]||[]).some(arr=>arr&&arr.length));
  const used={},out=[];
  for(let r=0;r<R;r++){
    const rd=[];
    for(let j=0;j<n;j++){
      const aa=a==="*"?avail[Math.random()*avail.length|0].id:a,nl=AR(aa).L.length;
      let ll=(l<0||a==="*")?Math.min(nl-1,Math.floor(j/n*nl)):l;
      let pool=(BANK[aa]&&BANK[aa][ll])||[];
      if(!pool.length){for(let k=0;k<nl;k++)if(BANK[aa]&&BANK[aa][k]&&BANK[aa][k].length){ll=k;pool=BANK[aa][k];break}}
      const free=[];pool.forEach((x,i)=>{if(typeof x==="function"||!used[aa+ll+i])free.push(i)});
      const i=free.length?free[Math.random()*free.length|0]:Math.random()*pool.length|0;
      used[aa+ll+i]=1;rd.push([aa,ll,i,Math.random()*1e9|0]);
    }
    out.push(rd);
  }
  return out;
}

function qHTML(e,hd,s){
  const q=QQ(e),stBadge=s.st>1?` <span class="badge">Racha ×${s.st}</span>`:"";
  return `<div class="top"><span>${esc(hd)}${stBadge}</span><span id="sec"></span></div><div class="mut">${esc(LB(e))}</div><div class="bar"><i id="bar"></i></div><h2>${esc(q.q)}</h2><div class="opts">${q.o.map((t,k)=>`<button class="opt${s.rev&&k!==q.c?" dim":""}${s.sel===k?" sel":""}${s.rev&&k===q.c?" ok":""}" data-c="${k}"${s.dis?" disabled":""}><span><b>${SYM[k]}</b> ${esc(t)}</span><span class="kbd">${KEYS[k]}</span></button>`).join("")}</div>`;
}
function startClock(T,onEnd){clearInterval(tick);curT=T;t0=Date.now();tick=setInterval(()=>{const e=(Date.now()-t0)/1000,b=$("#bar"),s=$("#sec");if(b)b.style.width=Math.max(0,100-e/T*100)+"%";if(s)s.textContent=Math.max(0,Math.ceil(T-e))+" s";if(e>=T){clearInterval(tick);if(onEnd)onEnd()}},100)}

function authCard(){
  if(USER)return "";
  return `<div class="card"><h3>Cuenta y registro de récords</h3><p class="mut">Inicie sesión con Google o con una cuenta protegida por contraseña para asociar su nombre a cada récord automáticamente.</p>
  <div class="row"><input id="au" placeholder="Usuario" maxlength="32" autocomplete="username"><input id="ap" type="password" placeholder="Contraseña segura" autocomplete="current-password"></div>
  <div class="row"><button class="btn" data-act="login">Iniciar sesión</button><button data-act="reg">Crear cuenta</button>${RKX.on?'<button data-act="gsign">Entrar con Google</button>':'<span id="gbtn"></span>'}</div>
  <div id="amsg"></div></div>`;
}

function home(){
  clearInterval(tick);clearTimeout(hostT);if(peer){try{peer.destroy()}catch(e){}peer=null}
  conns={};conn=null;G=null;MODE="off";renderBadge();
  const curRec=getRec(recKey());
  A.innerHTML=`<h1>Duelo de Preguntas</h1><p class="mut">Cuestionarios cronometrados para aprender y competir. (Atajos en teclado: teclas 1–4 y Enter).</p>
${authCard()}
<div class="card"><h3>Configuración de partida</h3>${cfg()}<p class="mut" id="recinfo">${curRec.p?`Récord actual en esta configuración: <b>${curRec.p}</b> (${esc(curRec.n)})`:"Sin récord registrado en esta configuración."}</p></div>
<div class="card"><h3>Práctica local</h3><p class="mut">Partida individual con estadísticas y registro de récords.</p><button class="btn" data-act="off">Empezar</button></div>
<div class="card"><h3>Sala en vivo</h3><p class="mut">Todos responden a la vez; nadie avanza hasta que todos contestan (o se acaba el tiempo).<br><b>Importante para el anfitrión:</b> Al finalizar cada partida, el anfitrión debe salir de la sala (botón «Salir de la sala» o «← Inicio») y crear una nueva sala para jugar otra partida.</p>
<input id="nm" placeholder="Su nombre" maxlength="32" value="${USER?esc(USER.n):""}" autocomplete="off"><div class="row"><button class="btn" data-act="host">Crear sala</button><input id="cd" placeholder="Código" maxlength="4" autocomplete="off" autocapitalize="characters" style="width:6em;text-transform:uppercase"><button data-act="join">Unirme</button></div><div id="msg"></div></div>
<div class="card" id="rk"></div>

${allCategoryRankingHTML()}`;
  initGoogle();rkRefresh();
}

// ===== MOTOR EN VIVO Y LOCAL =====
let peer=null,conns={},conn=null,PL={},S_={names:[],na:0,pend:[]},me="",isHost=false,G=null,code="",myA=null,key="",recKeyDone="",scores={},hostT=null,tries=0;
const mid=()=>isHost?"host":(peer&&peer.id);
const vA=a=>!!(a&&G&&G.ph==="q"&&a.g===G.gid&&a.i===G.i&&a.r===G.r);
const gQ=()=>G.rounds[G.r][G.i];
function bc(){const v=Object.keys(PL).map(k=>PL[k]);S_={t:"s",g:G,names:v.map(p=>p.n),na:v.filter(p=>vA(p.a)).length,pend:v.filter(p=>!vA(p.a)).map(p=>p.n)};Object.keys(conns).forEach(k=>{try{if(conns[k].open)conns[k].send(S_)}catch(e){}})}
function setG(g){G=g;bc();sync()}
function sync(){if(G&&G.ph==="q"){const k=G.gid+":"+G.r+":"+G.i;if(k!==key){key=k;myA=null;startClock(TT(gQ()),()=>{if(isHost)hostReveal();else liveView()})}}liveView()}
function startOff(){MODE="off";isHost=true;PL={host:{n:USER?USER.n:"Jugador"}};conns={};peer=null;hostStart()}
function enter(host){
  const nm=fixUtf8($("#nm").value.trim()).slice(0,32);if(!nm)return msg("Escriba su nombre.");
  if(!window.Peer)return msg("El modo en vivo necesita internet (no se pudo cargar PeerJS).");
  isHost=host;me=nm;G=null;myA=null;key="";scores={};PL={};conns={};tries=0;MODE="live";
  if(host)openHost();else{code=$("#cd").value.trim().toUpperCase();if(code.length!==4)return msg("El código tiene 4 letras.");openGuest()}}
function openHost(){
  code=Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ"[Math.random()*23|0]).join("");msg("Creando sala…");peer=new Peer("agq-"+code);
  peer.on("open",()=>{PL.host={n:me};G={ph:"lobby"};bc();liveView()});
  peer.on("error",e=>{if(e.type==="unavailable-id"&&tries++<5){try{peer.destroy()}catch(x){}openHost()}else msg("Error de red: "+e.type)});
  peer.on("connection",c=>{conns[c.peer]=c;
    c.on("data",m=>{if(!m)return;if(m.t==="join")PL[c.peer]={n:fixUtf8(String(m.n)).slice(0,32)};else if(m.t==="ans"&&PL[c.peer])PL[c.peer].a=m.a;bc();checkAll();liveView()});
    c.on("close",()=>{delete conns[c.peer];delete PL[c.peer];bc();checkAll();liveView()})})}
function openGuest(){
  msg("Conectando…");peer=new Peer();const fail=setTimeout(()=>msg("No se pudo conectar. Revise el código."),12000);
  peer.on("error",e=>{clearTimeout(fail);msg(e.type==="peer-unavailable"?"Sala no encontrada.":"Error de red: "+e.type)});
  peer.on("open",()=>{conn=peer.connect("agq-"+code,{reliable:true});
    conn.on("open",()=>{clearTimeout(fail);conn.send({t:"join",n:me})});
    conn.on("data",m=>{if(m&&m.t==="s"){S_=m;G=m.g;sync()}});
    conn.on("close",()=>{clearInterval(tick);A.innerHTML=`<div class="card"><b>El anfitrión cerró la sala o se perdió la conexión.</b></div><button class="btn" data-act="home">Volver al inicio</button>`})})}
function hostTimer(){clearTimeout(hostT);hostT=setTimeout(hostReveal,TT(gQ())*1000+1500)}
function checkAll(){if(!isHost||!G||G.ph!=="q")return;const v=Object.keys(PL).map(k=>PL[k]);if(v.length&&v.every(p=>vA(p.a)))hostReveal()}
function hostStart(){
  const n=Math.max(1,Math.min(+$("#n").value||5,20));selN=n;scores={};myStats={ok:0,tot:0,maxSt:0,wrong:[]};recKeyDone="";
  Object.keys(PL).forEach(k=>{PL[k].a=null});
  setG({ph:"q",gid:Math.random().toString(36).slice(2,7),rounds:mkRounds(selA,selL,n,selR),r:0,i:0,sc:{}});hostTimer();
}
function hostReveal(){if(!G||G.ph!=="q")return;clearTimeout(hostT);clearInterval(tick);const q=QQ(gQ());
  Object.keys(PL).forEach(k=>{const a=PL[k].a,pv=scores[k]||{p:0,rp:0,st:0,last:0,bon:0},good=vA(a)&&a.c===q.c,st=good?pv.st+1:0,base=good?pts(a.ms):0,bon=good?Math.min(st-1,5)*50:0,add=base+bon;
    scores[k]={n:PL[k].n,p:pv.p+add,rp:pv.rp+add,st:st,last:add,bon:bon}});
  setG(Object.assign({},G,{ph:"rev",sc:scores}))}
function hostNext(){if(G.ph==="rev"){if(G.i+1<G.rounds[G.r].length){setG(Object.assign({},G,{ph:"q",i:G.i+1}));hostTimer()}else setG(Object.assign({},G,{ph:"pod"}));return}
  if(G.r+1<G.rounds.length){Object.keys(scores).forEach(k=>{scores[k].rp=0});setG(Object.assign({},G,{ph:"q",r:G.r+1,i:0,sc:scores}));hostTimer();return}
  let rec={p:0,n:""},isNew=false;
  if(MODE==="off"){
    lastRecKey=recKey();rec=getRec(lastRecKey);const t=scores.host?scores.host.p:0;if(RKX.on&&RKX.user)RKX.submit(rkKey(),t);
    if(t>rec.p){isNew=true;rec={p:t,n:USER?USER.n:"Jugador"};setRec(lastRecKey,rec.p,rec.n)}
  }
  setG(Object.assign({},G,{ph:"end",best:rec.p,bestN:rec.n,newRec:isNew}))}
function saveRecName(){
  const inp=$("#recnm");if(!inp||!G)return;
  const nm=fixUtf8(inp.value.trim()).slice(0,32)||"Jugador";
  setRec(lastRecKey,G.best,nm);G.bestN=nm;G.newRec=false;
  if(scores.host)scores.host.n=nm;liveView();
}
function livePick(c){if(!G||G.ph!=="q"||myA||(Date.now()-t0)/1000>=curT)return;myA={i:G.i,g:G.gid,r:G.r,c:c,ms:Date.now()-t0};
  if(isHost){PL.host.a=myA;bc();checkAll()}else if(conn)conn.send({t:"ans",a:myA});liveView()}
const rows=(sc,k)=>Object.keys(sc||{}).map(i=>[i,sc[i]]).sort((a,b)=>b[1][k]-a[1][k]);
const board=(sc,k)=>`<ol class="bd">${rows(sc,k).map((r,idx)=>`<li value="${idx+4}" class="${r[0]===mid()?"me":""}">${esc(r[1].n)} — <b>${r[1][k]}</b></li>`).join("")}</ol>`;

// Podio escalado (2.° izquierda, 1.° centro, 3.° derecha) con alturas proporcionales al puntaje y peldaño
function podium(sc,k){
  const t=rows(sc,k);if(!t.length)return "";
  const maxP=Math.max(1,t[0][1][k]),M=["1","2","3"],MAX_H=[145,108,78],MIN_H=[52,38,28];
  const order=t.length===1?[0]:t.length===2?[1,0]:[1,0,2];
  return `<div class="pod">${order.map(i=>{
    const p=t[i][1],val=p[k]||0,ratio=Math.max(0,Math.min(1,val/maxP));
    const h=Math.round(MIN_H[i]+(MAX_H[i]-MIN_H[i])*ratio);
    return `<div class="pc r${i+1}"><div class="m m${i+1}">${M[i]}</div><div class="nm">${esc(p.n)}</div><div class="pts">${val} pts</div><div class="st" style="height:${h}px"></div></div>`;
  }).join("")}</div>`+(t.length>3?`<div class="card">${board(Object.fromEntries(t.slice(3)),k)}</div>`:"");
}

function statsHTML(){
  if(!myStats.tot)return "";
  const pct=Math.round(myStats.ok/myStats.tot*100);
  const wrongList=myStats.wrong.length?`<details style="margin-top:8px"><summary>Repasar preguntas falladas (${myStats.wrong.length})</summary>${myStats.wrong.map(w=>`<div style="border-top:1px solid var(--bd);padding:8px 0;margin-top:6px"><b>${esc(w.q)}</b><br><span style="color:#2f9e44;font-weight:600">Respuesta correcta: ${esc(w.ok)}</span>${w.e?`<div class="mut" style="font-size:.9rem">${esc(w.e)}</div>`:""}</div>`).join("")}</details>`:"";
  return `<div class="card"><h3>Estadísticas de la partida</h3><p style="margin:.3em 0">Aciertos: <b>${myStats.ok}/${myStats.tot}</b> (${pct}%) · Racha máxima: <b>×${myStats.maxSt}</b></p>${wrongList}</div>`;
}

const nextBtn=t=>isHost?`<button class="btn" data-act="next">${t}</button>`:`<p class="mut">Esperando al anfitrión…</p>`;
function liveView(){
  if(!G&&!peer)return;
  if(!G||G.ph==="lobby"){A.innerHTML=`<div class="card"><div class="mut">Código de sala</div><div class="code">${esc(code)}</div><p class="mut">Comparta el enlace de esta página y este código. Recuerde que al terminar la partida el anfitrión deberá salir de la sala para cerrar las conexiones.</p><h3>Jugadores (${S_.names.length})</h3><p>${S_.names.map(esc).join(" · ")||"…"}</p>${isHost?cfg()+`<div><button class="btn" data-act="start">Empezar</button></div>`:`<p class="mut">Esperando al anfitrión…</p>`}</div>`;return}
  const R=G.rounds.length;
  if(G.ph==="end"){
    const promptRec=(G.newRec&&!USER)?`<div class="card good"><b>¡Nuevo récord! (${G.best} pts)</b><p class="mut">Escriba su nombre para registrar la marca:</p><div class="row"><input id="recnm" placeholder="Su nombre" maxlength="32"><button class="btn" data-act="saverec" style="margin-top:0">Guardar récord</button></div></div>`:(G.newRec?`<div class="card good"><b>¡Nuevo récord registrado a nombre de ${esc(G.bestN)}: ${G.best} pts!</b></div>`:"");
    const hostNotice=MODE==="live"?`<div class="card warn"><b>Aviso para el anfitrión:</b> La partida ha finalizado. El anfitrión debe pulsar <b>«Salir de la sala»</b> para cerrar la sesión actual antes de iniciar una nueva sala.</div>`:"";
    A.innerHTML=`<h2>Resultado final</h2>`+podium(G.sc,"p")+statsHTML()+promptRec+(G.best?`<p class="mut">Mejor marca en esta configuración: <b>${G.best}</b> (${esc(G.bestN)})</p>`:"")+hostNotice+`<button class="btn" data-act="home">Salir de la sala</button>`;return}
  if(G.ph==="pod"){A.innerHTML=`<h2>Podio de la ronda ${G.r+1}/${R}</h2>`+podium(G.sc,"rp")+(R>1?`<div class="card"><h3>Acumulado general</h3><ol class="bd">${rows(G.sc,"p").map(r=>`<li class="${r[0]===mid()?"me":""}">${esc(r[1].n)} — <b>${r[1].p}</b></li>`).join("")}</ol></div>`:"")+nextBtn(G.r+1<R?"Siguiente ronda":"Ver resultado final");return}
  const e=gQ(),q=QQ(e),n=G.rounds[G.r].length,hd=(R>1?"Ronda "+(G.r+1)+"/"+R+" · ":"")+"Pregunta "+(G.i+1)+"/"+n;
  const mySc=(G.sc&&G.sc[mid()])||{p:0,st:0,last:0,bon:0};
  if(G.ph==="q"){const up=(Date.now()-t0)/1000>=curT;
    A.innerHTML=qHTML(e,hd,{sel:myA?myA.c:null,dis:!!myA||up,st:mySc.st})+`<p class="mut">${myA?"Respuesta enviada. ":up?"Tiempo agotado. ":""}${S_.pend.length?"Esperando a: "+S_.pend.map(esc).join(", "):"Todos respondieron"} (${S_.na}/${S_.names.length})</p>`;return}
  const a=myA&&myA.g===G.gid&&myA.i===G.i&&myA.r===G.r?myA:null,good=!!(a&&a.c===q.c);
  const rk=G.gid+":"+G.r+":"+G.i;
  if(recKeyDone!==rk){
    recKeyDone=rk;myStats.tot++;
    if(good){myStats.ok++;if(mySc.st>myStats.maxSt)myStats.maxSt=mySc.st}
    else myStats.wrong.push({q:q.q,ok:q.o[q.c],e:q.e});
  }
  const ptsInfo=good?` (+${mySc.last} pts${mySc.bon?`, incluye +${mySc.bon} por racha ×${mySc.st}`:""})`:"";
  A.innerHTML=qHTML(e,hd,{rev:1,sel:a?a.c:-1,dis:1,st:mySc.st})+`<div class="card ${good?"good":"bad"}"><b>${good?"¡Correcto!"+ptsInfo:a?"Incorrecto":"Tiempo agotado (sin respuesta)"}</b><p>${esc(q.e)}</p></div>`+(S_.names.length>1?`<div class="card"><h3>Ranking</h3><ol class="bd">${rows(G.sc,"p").map(r=>`<li class="${r[0]===mid()?"me":""}">${esc(r[1].n)} — <b>${r[1].p}</b>${r[1].st>1?` <span class="mut">×${r[1].st}</span>`:""}</li>`).join("")}</ol></div>`:`<p class="mut">Puntos acumulados: <b>${mySc.p}</b></p>`)+nextBtn(G.i+1<n?"Siguiente (Enter)":"Ver podio de la ronda (Enter)");
}
// ===== RANKING GLOBAL (Firebase; si no está configurado, se usan solo los récords locales) =====
const RKX=typeof RK!=="undefined"?RK:{on:false,user:null};
const rkKey=()=>selA+"_"+(selL<0?"p":selL)+"_"+selN+"_"+selR;
function rkRefresh(){if(RKX.on)RKX.refresh(rkKey())}
if(RKX.on)RKX.onAuth=u=>{if(u)saveSession({n:(u.displayName||u.email||"Usuario").slice(0,32),t:"Google"});else if(USER&&USER.t==="Google")saveSession(null);if(!G)home()};
const ACT={off:startOff,host:()=>enter(true),join:()=>enter(false),start:hostStart,next:hostNext,home:home,reg:authReg,login:authLogin,logout:()=>{if(RKX.on)RKX.signOut();saveSession(null);home()},gsign:()=>RKX.signIn(),saverec:saveRecName,theme:toggleTheme,exprec:exportRecords,imprec:importRecords};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.c!==undefined){livePick(+b.dataset.c);return}
  const f=ACT[b.dataset.act];if(f)f()});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||!G)return;
  if(G.ph==="q"&&!myA){
    const k=e.key.toUpperCase(),idx={"1":0,"2":1,"3":2,"4":3,"A":0,"B":1,"C":2,"D":3}[k];
    if(idx!==undefined){e.preventDefault();livePick(idx)}
  }else if((G.ph==="rev"||G.ph==="pod")&&isHost&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();hostNext();
  }
});
document.addEventListener("change",e=>{const i=e.target.id,v=e.target.value;
  if(i==="ar"){selA=v;selL=-1;$("#lv").innerHTML=lvOpts()}else if(i==="lv")selL=+v;else if(i==="n")selN=Math.max(3,Math.min(+v||5,20));else if(i==="rr")selR=+v;
  const ri=$("#recinfo");if(ri){const r=getRec(recKey());ri.innerHTML=r.p?`Récord actual en esta configuración: <b>${r.p}</b> (${esc(r.n)})`:"Sin récord registrado en esta configuración."}rkRefresh()});
home();
</script></body></html>
